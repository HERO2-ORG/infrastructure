secrets:
  GRAFANA_ADMIN_PASSWORD:
    generate: "openssl rand -base64 24"
  RESTIC_PASSWORD_STAGING:
    generate: "openssl rand -hex 32"
  RESTIC_PASSWORD_PRODUCTION:
    generate: "openssl rand -hex 32"
  RESTIC_REST_PASSWORD_STAGING:
    generate: "openssl rand -hex 32"
  RESTIC_REST_PASSWORD_PRODUCTION:
    generate: "openssl rand -hex 32"
  # Key and self-signed certificate for the internal VM's rest-server, in one
  # value so they always match; group_vars split it. The SAN is the internal VM.
  BACKUP_TLS_BUNDLE:
    generate: "openssl req -x509 -newkey rsa:4096 -nodes -days 3650 -subj /CN=hero2-backup -addext subjectAltName=IP:157.173.100.1 -keyout /dev/stdout -out /dev/stdout 2>/dev/null"
