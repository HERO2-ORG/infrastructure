- name: Download restic
  ansible.builtin.get_url:
    url: "https://github.com/restic/restic/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_linux_{{ restic_arch[ansible_facts.architecture] }}.bz2"
    dest: "/usr/local/lib/restic-{{ restic_version }}.bz2"
    checksum: "sha256:{{ restic_sha256[ansible_facts.architecture] }}"
    mode: "0644"

- name: Install bzip2 to unpack restic
  ansible.builtin.apt:
    name: bzip2
    state: present

# Trusts only a binary that runs: an unpack that once failed halfway left an
# empty file that a plain `creates:` would have kept forever.
- name: Unpack restic
  ansible.builtin.shell:
    cmd: |
      bin=/usr/local/bin/restic-{{ restic_version }}
      "$bin" version >/dev/null 2>&1 && exit 0
      bunzip2 -c /usr/local/lib/restic-{{ restic_version }}.bz2 > "$bin.tmp"
      chmod 0755 "$bin.tmp"
      mv "$bin.tmp" "$bin"
      echo unpacked
  register: restic_unpack
  changed_when: "'unpacked' in restic_unpack.stdout"
  when: not ansible_check_mode

# Check mode neither downloads nor unpacks, so there is nothing to link to yet.
- name: Point restic at the pinned version
  ansible.builtin.file:
    src: "/usr/local/bin/restic-{{ restic_version }}"
    dest: /usr/local/bin/restic
    state: link
  when: not ansible_check_mode
