- name: Set up node-exporter textfile collector for /srv directory metrics
  ansible.builtin.import_role:
    name: node-exporter-textfile

- name: Ensure monitoring client stack directory exists
  ansible.builtin.file:
    path: "{{ monitoring_client_stack_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Write monitoring client files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ monitoring_client_stack_path }}/{{ item.dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  loop:
    - src: docker-compose.yml.j2
      dest: docker-compose.yml
    - src: alloy-config.alloy.j2
      dest: alloy-config.alloy
  register: monitoring_client_files

- name: Start monitoring client stack (apply mode only)
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_client_stack_path }}"
    state: present
    pull: always
  when: not ansible_check_mode

# The Alloy config is bind-mounted, so a content change does not alter the compose
# service hash and `state: present` leaves the old process running with the old
# config loaded.
- name: Restart Alloy when its config changed
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_client_stack_path }}"
    services: [alloy]
    state: restarted
  when:
    - not ansible_check_mode
    - monitoring_client_files.changed
