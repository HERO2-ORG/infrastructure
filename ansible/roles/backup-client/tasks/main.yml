- name: Install restic
  ansible.builtin.import_role:
    name: restic

- name: Create the backup config directory
  ansible.builtin.file:
    path: /etc/hero2-backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Pin the backup server certificate
  ansible.builtin.copy:
    content: "{{ backup_tls_cert }}\n"
    dest: /etc/hero2-backup/rest-server.crt
    mode: "0644"

- name: Write the repository credentials
  ansible.builtin.template:
    src: hero2-backup.env.j2
    dest: /etc/hero2-backup/env
    mode: "0600"
  no_log: true

- name: Install the backup script
  ansible.builtin.copy:
    src: hero2-backup.sh
    dest: /usr/local/bin/hero2-backup.sh
    mode: "0755"

- name: Install the backup units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - hero2-backup.service
    - hero2-backup.timer

- name: Enable the nightly backup timer
  ansible.builtin.systemd:
    name: hero2-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
