- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow public HTTP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ public_http_ports }}"

- name: Allow app metrics only from internal VM
  community.general.ufw:
    rule: allow
    from_ip: "{{ groups.internal[0] }}"
    port: "{{ item }}"
    proto: tcp
  loop: "{{ monitoring_app_metrics_ports }}"
  when: inventory_hostname in groups.app_vms

- name: Deny public app metrics
  community.general.ufw:
    rule: deny
    port: "{{ item }}"
    proto: tcp
  loop: "{{ monitoring_app_metrics_ports }}"
  when: inventory_hostname in groups.app_vms

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny

# Docker publishes container ports with its own FORWARD rules, which bypass ufw
# entirely; the internal VM's databases are therefore guarded in the
# DOCKER-USER chain, the one hook Docker leaves to the host. The rules live in
# a script re-applied by a systemd oneshot after docker starts (ufw's own
# reload would not restore them, and iptables-persistent conflicts with ufw).
- name: Install the Docker guard script
  ansible.builtin.template:
    src: hero2-docker-guard.sh.j2
    dest: /usr/local/sbin/hero2-docker-guard
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups.internal
  notify: Apply Docker guard

- name: Install the Docker guard unit
  ansible.builtin.copy:
    src: hero2-docker-guard.service
    dest: /etc/systemd/system/hero2-docker-guard.service
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups.internal
  notify: Apply Docker guard

- name: Enable the Docker guard unit
  ansible.builtin.systemd:
    name: hero2-docker-guard.service
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups.internal
