- name: Check Docker CLI
  ansible.builtin.command: docker --version
  register: docker_cli
  check_mode: false
  changed_when: false
  failed_when: false

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_apt_packages }}"
    state: present
    update_cache: true
  when: docker_cli.rc != 0

- name: Ensure Docker CLI plugin directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_plugin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check Docker Compose plugin
  ansible.builtin.stat:
    path: "{{ docker_compose_plugin_path }}"
  register: docker_compose_plugin

- name: Install Docker Compose plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ docker_compose_arch }}"
    dest: "{{ docker_compose_plugin_path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not docker_compose_plugin.stat.exists

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started

- name: Ensure deploy user exists
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    create_home: true

- name: Ensure stack base directory exists
  ansible.builtin.file:
    path: "{{ stack_base_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# The provider IPv6 path black-holes large packets (PMTU): big transfers such as Docker Hub
# image pulls stall at ~200KB/s and time out, while IPv4 runs ~13MB/s. dockerd is written in
# Go, which ignores /etc/gai.conf, so it keeps picking the broken IPv6 path. No public origin
# has an AAAA record, so nothing inbound needs IPv6 here; force everything onto IPv4.
# The primary interface is listed explicitly: systemd-networkd re-enables IPv6 per
# interface when it reconfigures the link (observed 2026-06-10: eth0 came back with a
# global v6 address despite all/default=1 and a pull died on the v6 path again), and
# the all/default switches do not override a live per-interface re-enable.
- name: Disable IPv6 (broken provider path stalls docker image pulls)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    content: |
      # Managed by Ansible (docker role).
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.{{ ansible_default_ipv4.interface | default('eth0') }}.disable_ipv6 = 1
    owner: root
    group: root
    mode: "0644"

# Re-assert on every run, not only on file change: a networkd reconfigure between
# deploys can silently re-enable IPv6 with the file already in place.
- name: Apply sysctl (disable IPv6)
  ansible.builtin.command: sysctl --system
  changed_when: false

# With IPv6 disabled above, the provider's IPv6 nameserver that netplan hands to
# systemd-resolved is unreachable at the socket level (EADDRNOTAVAIL). resolved rotates
# to the next server on a timeout but never rotates away from a system error, so one
# IPv4 hiccup parks it on the dead server and every lookup on the host and in every
# container fails until someone runs `resolvectl dns` by hand (production,
# 2026-09-20: eleven hours of failed logins, Google sign-in and log shipping).
# The drop-in replaces the link's DNS list (`DNS=` resets it) and survives netplan
# regeneration; the runtime call applies it without reconfiguring the link.
- name: Check the netplan-rendered networkd unit for the primary interface
  ansible.builtin.stat:
    path: "/run/systemd/network/10-netplan-{{ ansible_default_ipv4.interface }}.network"
  register: primary_network_unit

- name: Assert the networkd unit exists (otherwise the DNS drop-in applies to nothing)
  ansible.builtin.assert:
    that: primary_network_unit.stat.exists
    fail_msg: >-
      /run/systemd/network/10-netplan-{{ ansible_default_ipv4.interface }}.network is missing;
      the resolver drop-in below would be ignored. Check `networkctl status` and adjust the path.

- name: Ensure networkd drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/network/10-netplan-{{ ansible_default_ipv4.interface }}.network.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin link DNS to IPv4 upstreams
  ansible.builtin.template:
    src: hero2-dns.conf.j2
    dest: "/etc/systemd/network/10-netplan-{{ ansible_default_ipv4.interface }}.network.d/hero2-dns.conf"
    owner: root
    group: root
    mode: "0644"

- name: Ensure resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give resolved IPv4 fallback servers
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/hero2.conf
    content: |
      # Managed by Ansible (docker role).
      [Resolve]
      FallbackDNS={{ resolver_upstreams | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: Apply the IPv4 resolver list to the live link
  ansible.builtin.command:
    argv: "{{ ['resolvectl', 'dns', ansible_default_ipv4.interface] + resolver_upstreams }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify the host resolves a public name
  ansible.builtin.command:
    argv: ["getent", "hosts", "auth.hero2.org"]
  changed_when: false
  when: not ansible_check_mode
