monitoring_client_stack_path: "{{ stack_base_path }}/monitoring-client"

# Backend-stack details that monitoring-client wires into. Compose v2 names networks
# `<project>_<name>`; the backend stack is deployed from /srv/stack/backend so its
# project name is `backend`. The exporter joins that network so it can reach the
# Redis container by service name, and reads REDIS_PASSWORD from the backend's own
# .env file (rendered by the backend's deploy) — single source of truth, no shared
# secret, rotation handled the moment the backend rolls.
backend_compose_project_name: backend
backend_app_network_external_name: "{{ backend_compose_project_name }}_app"
backend_env_file_path: "{{ stack_base_path }}/backend/.env"

# BullMQ queue state the monitoring server alerts on, as redis_key_size key patterns.
# `wait`/`active` are LISTs (LLEN), `delayed`/`failed`/`completed` are ZSETs (ZCARD).
# Backlog on either side means one half of the pipeline has stalled:
#   sensor_processing_jobs growing → trip-inference microservice is down/slow
#   trip_results growing            → backend's startTripResultsWorker has died
# `failed` growing means jobs are terminally dying — invisible in the DB, only the
# queue shows it.
monitoring_redis_bull_keys:
  - "bull:*:wait"
  - "bull:*:active"
  - "bull:*:delayed"
  - "bull:*:failed"
  - "bull:*:completed"

# --- trip-inference worker (deploy/inference/playbook-inference.yml) ---
# Shared across both app VMs: one MLflow registry and one infra-tile-service serve both.
# The worker polls the registry through MLflow's token-gated service-auth route (mlflow-svc-auth on
# the internal VM :5001, firewalled to the app VMs); it sends MLFLOW_SERVICE_TOKEN as the bearer.
# This is the headless path - the Google-OAuth front door (mlflow.internal.hero2.org) is for humans.
inference_mlflow_tracking_uri: "http://157.173.100.1:5001"

# Fetch-on-miss park flow: the worker parks coverage-missed jobs and the infra-tile stack
# (API + fetch-worker, internal VM) builds the missing tiles on demand. The trip-inference
# pipeline passes inference_infra_backend=tile_cache explicitly on deploy; this default
# documents the desired state. Requires the infra-tile stack to be reachable from the app VMs.
inference_infra_backend: tile_cache
inference_infra_tile_url: "https://infra-tile.internal.hero2.org"
