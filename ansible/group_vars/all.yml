deploy_user: deploy
ansible_user: "{{ deploy_user }}"
stack_base_path: /srv/stack
data_base_path: /srv/data

ssh_port: 22
public_http_ports:
  - 80
  - 443

monitoring_node_exporter_port: 9100
monitoring_cadvisor_port: 8080
monitoring_redis_exporter_port: 9121

# Ports the monitoring server scrapes on each app VM. ufw allows them only from
# the internal VM; anything not in this list stays denied. Add new exporter ports here.
monitoring_app_metrics_ports:
  - "{{ monitoring_node_exporter_port }}"
  - "{{ monitoring_cadvisor_port }}"
  - "{{ monitoring_redis_exporter_port }}"

loki_port: 3100
loki_image: grafana/loki:3.5.0
alloy_image: grafana/alloy:v1.8.3

# Alloy on each app VM pushes logs to Loki over TLS via the internal VM's Traefik,
# authenticated with basic auth. Requires a DNS A record: loki_domain -> internal VM IP.
loki_domain: logs.internal.hero2.org
loki_basic_auth_user: alloy
loki_basic_auth_password: "{{ LOKI_INGEST_PASSWORD }}"

docker_apt_packages:
  - ca-certificates
  - curl
  - gnupg
  - docker.io
docker_compose_version: v2.29.7
docker_compose_arch: "{{ 'x86_64' if ansible_facts.architecture == 'x86_64' else ansible_facts.architecture }}"
docker_compose_plugin_dir: /usr/local/lib/docker/cli-plugins
docker_compose_plugin_path: "{{ docker_compose_plugin_dir }}/docker-compose"

obsolete_root_paths:
  - /root/.openclaw
